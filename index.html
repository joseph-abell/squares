<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squares — A5 Game Board Book</title>
<style>
  :root {
    --page-w: 148mm;
    --page-h: 210mm;
    --margin: 10mm;
    --ink: #666;
    --muted: #666;
    --dot-gap: 8mm;
  }

  * {
    box-sizing: border-box;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }

  body {
    margin: 0;
    background: #e9e9e9;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--ink);
  }

  .toolbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
    padding: 10px;
    background: #ffffff;
    border-bottom: 1px solid #ccc;
  }

  .toolbar button {
    padding: 10px 18px;
    font-size: 15px;
    border: 1px solid #222;
    background: #fff;
    cursor: pointer;
  }

  .toolbar button:hover {
    background: #f0f0f0;
  }

  .book {
    padding-top: 64px;
  }

  .page {
    width: var(--page-w);
    height: var(--page-h);
    margin: 12px auto;
    background: white;
    box-shadow: 0 2px 10px rgba(0,0,0,.18);
    position: relative;
    padding: var(--margin);
    display: flex;
    flex-direction: column;
    page-break-after: always;
    break-after: page;
  }

  .title-page {
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .title {
    font-size: 28pt;
    font-weight: bold;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .author {
    margin-top: 8mm;
    font-size: 12pt;
    color: var(--muted);
  }

  .dedication {
    margin-top: 28mm;
    font-size: 11pt;
    color: var(--muted);
  }

  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 8.5pt;
    color: var(--muted);
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .board-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4mm 0;
  }

  .dots {
    display: grid;
    width: max-content;
    height: max-content;
    max-width: 100%;
    max-height: 160mm;
    margin: auto;
  }

  .dot {
    width: 0;
    height: 0;
    border: 0.55mm solid var(--ink);
    border-radius: 50%;
    place-self: center;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }

  .page-footer {
    display: flex;
    justify-content: center;
    align-items: baseline;
    font-size: 9pt;
    color: var(--ink);
  }

  .page-number {
    font-weight: bold;
  }

  @page {
    size: A5 portrait;
    margin: 0;
  }

  @media print {
    * {
      print-color-adjust: exact;
      -webkit-print-color-adjust: exact;
    }

    body {
      background: white;
    }

    .toolbar {
      display: none;
    }

    .book {
      padding-top: 0;
    }

    .page {
      margin: 0;
      box-shadow: none;
      width: var(--page-w);
      height: var(--page-h);
    }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="window.print()">Print / Save as PDF</button>
  <span>122 A5 pages · title page, blank page, then game boards</span>
</div>

<main class="book" id="book"></main>

<script>
  // Each group has 12 pages: 10 groups x 12 = 120 game pages.
  // Values are boxes, not dots: a 5x5 board has 5 columns and 5 rows of boxes,
  // requiring a 6x6 grid of dots.
  const groups = [
    { label: "Small Squares", boards: [["4x4", 4, 4], ["5x5", 5, 5], ["4x6", 4, 6]] },
    { label: "Medium Squares", boards: [["5x6", 5, 6], ["6x6", 6, 6], ["5x7", 5, 7]] },
    { label: "Large Squares", boards: [["6x7", 6, 7], ["7x7", 7, 7], ["6x8", 6, 8]] },
    { label: "Tall Boards", boards: [["7x8", 7, 8], ["7x9", 7, 9], ["8x8", 8, 8]] }
  ];

  const pagesPerGroup = 12;
  const book = document.getElementById("book");
  let pageNumber = 0;

  function createPage(className = "page") {
    const page = document.createElement("section");
    page.className = className;
    book.appendChild(page);
    return page;
  }

  function makeTitlePage() {
    const page = createPage("page title-page");

    page.innerHTML = `
      <div class="title">Squares</div>
      <div class="author">By Joseph Abell</div>
      <div class="dedication">For Ginny, Jessica, Alex and friends</div>
    `;
  }

  function makeBlankPage() {
    createPage("page");
  }

  function makeBoard(cols, rows) {
    const wrap = document.createElement("div");
    wrap.className = "board-wrap";

    const grid = document.createElement("div");
    grid.className = "dots";
    grid.style.gridTemplateColumns = `repeat(${cols + 1}, minmax(0, var(--dot-gap)))`;
    grid.style.gridTemplateRows = `repeat(${rows + 1}, minmax(0, var(--dot-gap)))`;

    const totalDots = (cols + 1) * (rows + 1);

    for (let i = 0; i < totalDots; i++) {
      const dot = document.createElement("div");
      dot.className = "dot";
      grid.appendChild(dot);
    }

    wrap.appendChild(grid);
    return wrap;
  }

  function makePage(groupLabel, boardLabel, cols, rows) {
    pageNumber++;

    const dotCols = cols + 1;
    const dotRows = rows + 1;
    const dotLabel = `${dotCols}x${dotRows} dots`;

    const page = createPage();

    const header = document.createElement("div");
    header.className = "page-header";
    header.innerHTML = `<span>Squares</span><span>${groupLabel} · ${dotLabel}</span>`;

    const board = makeBoard(cols, rows);

    const footer = document.createElement("div");
    footer.className = "page-footer";
    footer.innerHTML = `
      <span class="page-number">${pageNumber}</span>
    `;

    page.append(header, board, footer);
  }

  makeTitlePage();
  makeBlankPage();

  groups.forEach(group => {
    for (let i = 0; i < pagesPerGroup; i++) {
      const board = group.boards[i % group.boards.length];
      makePage(group.label, board[0], board[1], board[2]);
    }
  });
</script>

</body>
</html>
